            const allowedOrSpecialRegex = /([\-_'’ .]|[\p{L}\p{M}])/u;
            nameInputs.forEach(function(nameInput) {
               const inputElement = document.querySelector(`input[name='${nameInput}']`);
               if (inputElement) {
                  inputElement.setAttribute('maxlength', '40');
                  let isComposing = false;
                  inputElement.addEventListener('compositionstart', function() {
                     isComposing = true;
                  });
                  inputElement.addEventListener('compositionend', function() {
                     isComposing = false;
                     filterNameInput(inputElement);
                  });
                  inputElement.addEventListener('input', function(e) {
                     if (!isComposing) {
                        filterNameInput(inputElement);
                     }
                  });
               }
            });

            function filterNameInput(inputElement) {
               let value = inputElement.value;
               let filtered = '';
               let lastWasSpecial = false;
               for (let char of value.normalize('NFC')) {
                  if (allowedOrSpecialRegex.test(char)) {
                     if (/^[\-_'’ .]$/.test(char)) {
                        if (!lastWasSpecial && filtered.length > 0) {
                           filtered += char;
                           lastWasSpecial = true;
                        }
                     } else {
                        filtered += char;
                        lastWasSpecial = false;
                     }
                  }
               }
               filtered = filtered.replace(/^[\-_'’ .]+/, '');
               if (filtered !== value) {
                  inputElement.value = filtered;
               }

                     partnerNumberBox.style.display = "block";
                     
                     let optionalboxes = document.getElementsByClassName("o-form-explain")
                     optionalboxes.forEach( (el) => {
                        el.style.display = "none";
                     });
                  } else {
                     partnerNumberBox.style.display = "none";
                  }
               });
            }
         }

         const jobSelect = document.querySelector('select[name="userProfile.title"]');
         const dataPrivacySelect = document.querySelector('select[name="userProfile.lmsDataPrivacy"]');
         if (jobSelect) {
            jobSelect.addEventListener("focusin", (event) => {
               if (event.target && event.target.matches("select")) {
                  if (!$("select[name='userProfile.title'] option:selected").length > 0) {
                     validateCustomDropdown(jobSelect, varLocaliztion);
                     disableLoginBtn();
                  }
               }
            });

            jobSelect.addEventListener("change", function (event) {
               if (event.target && event.target.matches("select")) {
                  const parentElement = event.target.parentElement.parentElement;
                  $(parentElement).removeClass("o-form-has-errors");
                  $("#dropdown-error").remove();
               }
               if ($("select[name='userProfile.title'] option:selected").length > 0) {
                  enableLoginBtn();
               }
            });
         }

         if (dataPrivacySelect) {
            dataPrivacySelect.addEventListener("focusin", (event) => {
               if (event.target && event.target.matches("select")) {
                  if (!$("select[name='userProfile.lmsDataPrivacy'] option:selected").length > 0) {
                     validateCustomDropdown(dataPrivacySelect, varLocaliztion);
                     disableLoginBtn();
                  }
               }
            });

            dataPrivacySelect.addEventListener("change", function (event) {
               if (event.target && event.target.matches("select")) {
                  const parentElement = event.target.parentElement.parentElement;
                  $(parentElement).removeClass("o-form-has-errors");
                  $("#dropdown-error").remove();
               }
               if ($("select[name='userProfile.lmsDataPrivacy'] option:selected").length > 0) {
                  enableLoginBtn();
               }
            });
         }
      });

      const loadCAPTCHA = () => {
         const oktaId = document.getElementsByTagName('form')[0];
         oktaId.addEventListener('submit', (event) => {checkCaptcha(event)});
         document.querySelector('form input[type="submit"]').addEventListener("click", (event) => {
            const canSubmit = checkCaptcha(event);
            if (!canSubmit) event.preventDefault();
            return;
         });
         const oktaLoginBtn = $(".button.button-primary");
         const oktaLoginBtnDiv = $(".o-form-button-bar");
         const captchaDiv = document.createElement('div');
         captchaDiv.setAttribute('id','captchaDiv');
         captchaDiv.className = 'h-captcha';
         captchaDiv.style.margin = 'auto';
         captchaDiv.style.width = '302px';
         captchaDiv.style.paddingBottom = '10px';
         captchaDiv.setAttribute('data-sitekey','3b9c1f8a-dd7c-4846-9ac6-a4aaac747df0');
         captchaDiv.setAttribute('data-callback', 'captchaDone');
         $(oktaLoginBtnDiv).before(captchaDiv);
         const htmlBody = document.getElementsByTagName('body')[0];
         const captchaScript = document.createElement('script');
         captchaScript.src = 'https://js.hcaptcha.com/1/api.js';
         captchaScript.setAttribute("nonce", "");
         htmlBody.appendChild(captchaScript);
         disableLoginBtn();
      };

      window.captchaDone = (value) => {
         if (value && value.length > 1) {
            enableLoginBtn();
            $("#showError").hide();
         }
      }

      const checkCaptcha = (event) => {
         if (window.hcaptcha.getResponse() && window.hcaptcha.getResponse().length > 1) {
            validateCountryDropdown(varLocaliztion);
            validateLocaleDropdown(varLocaliztion);
            return true;           
         } else {
            event.preventDefault();
            if (window.captchaValidate === false) {
               const captchaDiv = document.getElementById('captchaDiv');
               const errorDiv = document.createElement('div');
               errorDiv.setAttribute('id','showError');
               captchaDiv.appendChild(errorDiv);
               errorDiv.innerHTML = '<span style="color:red;">You must click <span style="color:black">"I am a human"</span> checkbox</span>';
               window.captchaValidate = true;
            }
         }
      
      };
      
      const disableLoginBtn = () => {
         const oktaLoginBtn = document.querySelector("input[type='submit']");
         oktaLoginBtn.disabled = true;
         oktaLoginBtn.classList.remove('button-primary');
      };
      
      const enableLoginBtn = () => {
         const oktaLoginBtn = document.querySelector("input[type='submit']");
         oktaLoginBtn.disabled = false;
         oktaLoginBtn.classList.add('button-primary');
      };
   </script>
   </body>
</html>
